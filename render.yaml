    runtime: docker
    region: virginia
    plan: starter
    schedule: "*/12 * * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: 'python -u -c "import urllib.request,time; s=time.time(); urllib.request.urlopen(''https://cr-obituaries-dashboard.onrender.com/health-status.json'',timeout=120).read(); print(''warm in %.1fs''%(time.time()-s))"'

