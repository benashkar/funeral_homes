services:
  - type: cron
    name: funeral-homes-scraper
    runtime: docker
    region: virginia
    schedule: "0 12 * * *"  # 12:00 UTC = 6:00 AM CT (7 AM EDT)
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: DB_NAME
        value: funeral_homes

  - type: web
    name: cr-obituaries-dashboard
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile.web
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: DB_NAME
        value: funeral_homes
