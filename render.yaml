# SOURCE OF TRUTH = the Render API, NOT this file. Generated from the API 2026-09-04 and kept as
# accurate DOCUMENTATION of what is actually running.
#
# WARNING: KEEP BLUEPRINT AUTO-SYNC **OFF** in the Render dashboard. A sync would (a) revert any
#     API-side schedule or command change and (b) DELETE every service not defined here. Until
#     2026-09-04 this file declared 2 services while 21 were live -- a sync would have destroyed
#     nineteen of them, including every scraper.
#
# NAMING TRAP: four services in this repo carry a `cr-` prefix -- cr-obituaries-dashboard and
#     cr-rescue-scraper-1/2/3. That prefix reads as "Cherry Road" in a Render account that also
#     holds 34 genuine cr-* services from benashkar/cherry-road-dashboard. On 2026-09-04 a
#     fleet-wide cr-* deploy sweep picked up `cr-dashboard-keepwarm` from THIS repo by accident;
#     it has since been renamed to funeral-homes-dashboard-keepwarm. The other three were missed
#     by that sweep only because they fell on a later API page. Do not add another `cr-` name
#     here; rename the remaining four when their URLs can afford it (cr-obituaries-dashboard's
#     hostname is baked into the keepwarm cron that pings it).
# ============================================================================================
services:

  # srv-d6lj29sr85hc73a8f1m0  autoDeploy=yes
  - type: web
    name: cr-obituaries-dashboard
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./Dockerfile.web

  # crn-d7dbjenavr4c73e0212g  autoDeploy=no
